name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita ejecuciones duplicadas cuando se hacen varios push seguidos a la
# misma rama/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck y pruebas unitarias
    runs-on: ubuntu-latest
    env:
      # Placeholder solo para `prisma generate` (no se abre conexión real):
      # este job no ejecuta migraciones ni pruebas contra una base de datos.
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/axessia_ci_placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Pruebas unitarias (Vitest)
        run: npm run test

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # Solo corre si el repositorio tiene configurado un entorno de pruebas
    # aislado. Si faltan estos secrets, el job se omite en vez de fallar o
    # de arriesgarse a usar una base de datos incorrecta.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_ALLOW_MUTATIONS: "true"
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones en la base de datos de pruebas aislada
        run: npx prisma migrate deploy

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
